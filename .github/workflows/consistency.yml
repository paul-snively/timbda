name: consistency
# M-1 DoD: pin check + trivial Bazel/Rocq/Haskell stubs green.
# TODO(M-2): nightly DCont-drift job (reapply patch series onto upstream main, non-blocking).
on:
  push: {}
  pull_request: {}

jobs:
  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/pins/pins.py check
      - run: python3 tools/pins/milestones.py check

  bazel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install bazelisk (respects .bazelversion)
        # Measured root cause of this job's failure on every run since 2026-11-19
        # (bazel red, pins and nix green on all 40): GitHub-hosted ubuntu-24.04
        # runners execute steps as a NON-ROOT user, so the unprivileged write to
        # /usr/local/bin failed with curl's exit 23, "Failure writing output to
        # file".  Install into $HOME/.local/bin and extend GITHUB_PATH instead.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/bazelisk" https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x "$HOME/.local/bin/bazelisk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bazelisk test //dialect:timbda_dialect_test --test_output=all

  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix flake check -L
