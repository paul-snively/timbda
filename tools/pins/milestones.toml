closed = "2026-11-27"
about_line = "compile = a fold-specialized hylomorphism with a proved budget law and a 13-program golden test pinned Coq->clang->run; nine-lane gate chain green."

[[milestone]]
id = "M3"
summary = "The full Gallina evaluator: T8/T9 end-to-end with zero boost.context; carries the named M2 debts (loop-fusion carrier ruling, context-carried choice-node emission, multi-site hint queue, fail-as-carrier)."
