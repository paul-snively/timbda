# Timbda-0 pin table -- the single source of truth (docs/PLAN.md sec. 6).
# CI asserts: this table == MODULE.bazel == .bazelversion == flake.lock
# and == the nixpkgs-provided tool versions used by flake checks.
# Any PR touching a compiler-adjacent pin must touch this table.

[nixpkgs]
input = "github:NixOS/nixpkgs"
branch = "nixos-26.05"
rev = "b349185bb79c7cf7ad8ea8c097931730bf473c71"
note = "chosen for compcert 3.17 + rocq 9.1 window (PLAN pin matrix)"

[bazel]
version = "9.3.2"
note = "= .bazelversion; hermetic-llvm 0.8.23 declares bazel_compatibility >=7.7.0 (the 0.8.27-era pairing pinned 9.3.2 too); bazelisk in devShell"

[hermetic_llvm]
source = "github:hermeticbuild/hermetic-llvm"
bcr_module = "llvm"
bcr_version = "0.8.23"
llvm_default_version = "23.1.0"
ref_tag = "v0.8.23"
note = "one clang law (decision 20, 2026-11-27): this vintage == [tooling.clang] == [formal.mlir_gen] == 23.1.0.  The M-1..M2-era record stands: those builds ran on 0.8.27 / LLVM 23.1.2; the elimination ledger is PLAN decision 20."
# 23.1.2 (modules 0.8.24..0.8.27) measured ABSENT from nixpkgs: master bumped
# 23.1.0 -> 23.1.3 (bac772ef57a2, 2026-10-06), nixos-26.05 backported the same
# jump (d2ae523a695d); no nixpkgs rev ever evaluates clang 23.1.2 and no
# substitute exists.  BCR tops out at 0.8.27, so >=23.1.3 is unreachable on the
# bazel side.  The shared vintage is therefore exactly 23.1.0.

[llvm_project]
# Watch-out #1: our dialect <-> DCont fork <-> llvm-project commit must share
# ONE MLIR API vintage.
m1_source = "hermetic-llvm default source archive (llvm-project-23.1.2.src)"
# 2026-11-27 (decision 20): the live default archive is hermetic-llvm 0.8.23's
# llvm-project-23.1.0.src; the line above stays as the M-1-era record.
dcont_vintage_repo = "https://github.com/byeongjee/llvm-project.git"
dcont_vintage_commit = "67772838e389c548f68c5513a0d417c0534ac9c7"
dcont_vintage_date = "2026-02-15"
dcont_vintage_msg = "[MLIR][WasmSSA] Add global_set and ref_null support"
probe_note = "llvmorg-23.1.2 WasmSSA lacks RefNullOp+GlobalSetOp; llvm main lacks RefNullOp (probe 2026-11). M-2 wires llvm.from_git(above) and re-probes."

[dcont]
flake_input = "mlir-wasm-dialect"
# out-of-tree Wasm/DCont dialect repo; we will fork it (PLAN sec. 6.3)
upstream = "github:CMUAbstract/mlir-wasm-dialect"
branch = "main"
rev = "6be18d00a0c1472a4415f24deb9ba72101c8132e"
rev_date = "2026-05-30"

[formal.rocq]
# nixpkgs-provided versions; assert against flake's nixpkgs at eval time
# note: nixos-26.05 has no rocqPackages.coq attr; rocq-core is the core package
nixpkgs_attr = "rocqPackages.rocq-core"
version = "9.1.1"

[formal.compcert]
nixpkgs_attr = "coqPackages_9_1.compcert"
version = "3.17"
note = "ccomp lane is license-gated (later milestone); build-time lib dep only for now.  2026-11-25: attribute moved from `compcert` to `coqPackages_9_1.compcert` - the top-level attr is wired from coqPackages_9_0 (drv evidence: coqdevdir lib/coq/9.0/user-contrib), whose .vo are prover-9.0-locked and unusable on this stack's rocq 9.1.1; same 3.17 source, 9.1-series build."

[formal.mlir_gen]
# PLAN sec. 6 stipulates "-gen-rocq output on the Nix side": the tblgen-rocq
# backend is a Nix-side artifact built from nixpkgs' TableGen closure, with the
# Bazel graph (hermetic-llvm 23.1.2) owning only the dialect C++/DRR.  Measured
# 2026-11-25 (probes p512/p513, docs/DESIGN-NOTES.md sec. 13.10): nixpkgs ships
# everything the backend needs at 23.1.0 (llvm.dev llvm/TableGen/*.h, llvm.lib
# libLLVMTableGen/libLLVMSupport/libLLVMDemangle), but NOT the mlir TableGen
# Record/RecordKeeper headers (nixpkgs' install set omits them) and no
# mlir-tblgen/mlir-pdll binary; probe p513 parsed the real dialect/Timbda.td
# with llvm::TableGenParseFile and found 72 TimbdaRuleRecord defs / 26 selected
# - the audit's own counts.  Vintage pair 23.1.0 (Nix generation side) vs
# 23.1.2 (Bazel dialect side): same 23.1 series; divergence between the two
# corners surfaces as generation-lane drift and is resolved by a deliberate pin
# batch, never silently.
# 2026-11-27 (decision 20): the batch landed.  The Bazel corner moved to 23.1.0
# (hermetic-llvm 0.8.23); both corners now share ONE vintage, and pins.py's
# one-clang-law check asserts this version == [tooling.clang].version ==
# [hermetic_llvm].llvm_default_version.  M-2's from_git fork commit (watch-out
# #1) is the named successor divergence: an MLIR-only fork of the vintage,
# re-pinned by its own batch.
nixpkgs_attr = "llvmPackages_23.mlir"
version = "23.1.0"

[formal.stdpp]
nixpkgs_attr = "rocqPackages.stdpp"
version = "1.13.0"
note = "pinned but used by no build: nothing in coq/ imports stdpp and it is deliberately NOT in flake.nix's rocqDeps.  Kept for a possible M2/M3 candidate-bag layer.  Measured 2026-11-18: candidate sets stay ctrees br2 read up to wbisim, not gset - gset needs Countable/EqDecision for the mutually recursive Val/Expr/SResult domain (probe gB1: 'Could not find an instance for EqDecision SResult'), listset only speaks up to setoid equality (probe gC2), and stdpp's re-exported Stdlib.Bool level-40 '&&&' collides with RelationAlgebra's level-59 '&&&' that CTree.Eq.WBisim pulls (probes gE/gE2/gG1-gG9).  See docs/DESIGN-NOTES.md sec. 7."

[formal.equations]
nixpkgs_attr = "coqPackages.equations"
version = "1.3.1+9.1"

[formal.ctrees]
flake_input = "ctrees"
repo = "github:vellvm/ctrees"
branch = "dev"
rev = "cabcf9bf24b0f459204a7da19ac01b7697ff04e3"
note = "deps itrees(inc. RelationAlgebra)/extlib/coinduction pinned above; equations from nixpkgs; no stdpp in its buildInputs (measured 2026-11-18: the pinned ctrees sources reference stdpp zero times, and declare no '&&&' notation); local mkRocqDerivation in M-2"

[formal.itrees]
flake_input = "interaction-trees"
repo = "github:DeepSpec/InteractionTrees"
branch = "master"
rev = "284d42248a3c5517cff9f582e335fcee2f6bdc1f"
note = "the revision the transitional switch pinned (coq-itree dev@284d4224); dune lang coq 0.2; builds clean on nix rocq 9.1.1 with extlib + paco in scope"

[formal.extlib]
flake_input = "coq-ext-lib"
repo = "github:rocq-community/coq-ext-lib"
branch = "master"
rev = "c5cdb83d48786ca2680c6d817c19bb99f68d4ca3"
note = "dune lang coq 0.8 -> coqc -boot, which drops rocq 9.1's implicit Stdlib loadpath; the flake derivation re-pins the project to lang 0.7 (postPatch), the mode our own coq/dune-project uses. Verified on nix rocq 9.1.1 (2026-11-18)."

[formal.coq_stdlib]
nixpkgs_attr = "rocqPackages.stdlib"
version = "9.0.0"
note = "provides the Stdlib logical tree (From Stdlib Require ...) that rocq 9.1 splits out of rocq-core; nixpkgs ships it as a package, not as core theories"

[formal.relation_algebra]
nixpkgs_attr = "rocqPackages.relation-algebra"
version = "1.8.0"

[formal.coinduction]
flake_input = "coinduction"
repo = "github:damien-pous/coinduction"
tag = "v1.21"
rev = "a88f0f4f170dcb9b24e3d470c76801a765423598"
note = "M-2 retarget: master (07d2a09f) requires rocq >= 9.2 and fails on rocq 9.1.1 (theories/lattice.v:40 parse error); v1.21 is the DEV-3-proven 9.1 line (opam rocq-coinduction 1.21: rocq-core >= 9.0 < 9.3, no Elpi dep)."

[formal.paco]
flake_input = "paco"
repo = "github:snu-sf/paco"
branch = "master"
rev = "d0561bf7f0a96cac486ba3bd8ca0b72ce01fb9cf"
note = "implicit dep of interaction-trees (theories/Interp/RecursionFacts.v requires Paco.paco; Props/* + Core/* use pacotac); same dev revision the switch pinned"

[formal.certirocq]
flake_input = "certirocq"
repo = "github:CertiRocq/CertiRocq"
branch = "main"
rev = "943b52ae654708130f241ccf8a50ecb95a7956e2"

# VeriFFI runtime pieces (monitors + link glue) are CI-lane only -- PLAN sec. 4
# extern-monitor boundary policy; no shipped VeriFFI overhead. Pin stays for the CI lane.
[formal.veriffi]
flake_input = "veriffi"
repo = "github:CertiRocq/VeriFFI"
branch = "main"
rev = "7e8cd8e7b631be066407f86c82ff60b6fc63ae0b"

[haskell.verse_semantics]
flake_input = "verse-semantics"
repo = "github:augustss/verse-semantics"
branch = "main"
rev = "d0eababfb7a5662f40bc7de45a596cb925445b8d"
note = "built with nixpkgs Haskell infra from M-3; cabal dep set pinned then"

[haskell.ghc]
nixpkgs_attr = "haskell.compiler.ghc912"
version = "9.12.3"

[runtime.wasmtime]
nixpkgs_attr = "wasmtime"
version = "45.0.2"
note = "record WAMI stack-switching engine flags per harness when WAMI leg lands (watch-out #4)"

[tooling.lit]
nixpkgs_attr = "lit"
version = "18.1.8"

# the clang checks.golden-compile builds the golden translation unit with (D4b).
# Moved 2026-11-27 (decision 20) off pkgs.clang - nixpkgs' DEFAULT llvmPackages
# clang at this rev, measured 21.1.8: a third vintage nothing ever logged.
# version-consistency asserts it against nixpkgs; pins.py asserts it equals
# [hermetic_llvm].llvm_default_version and [formal.mlir_gen].version.
[tooling.clang]
nixpkgs_attr = "llvmPackages_23.clang"
version = "23.1.0"

[tooling.dune]
nixpkgs_attr = "dune"
version = "3.21.1"
note = "coq.theory build of coq/ (lang coq 0.7); dune >= 3.24 removes the Coq build language, so the flake pins it explicitly"

[tooling.ocaml_for_rocq]
nixpkgs_attr = "rocqPackages.rocq-core.ocamlPackages.ocaml"
version = "4.14.4"
note = "the OCaml ABI rocq 9.1.1 plugins compile against; plugins live in lib/ocaml/4.14.4/site-lib (findlib), theories in lib/coq/9.1/user-contrib"

[deferred]
note = "cabal package set + flocq/menhirLib/boost.context pins are generated from this table at their milestone.  The DEV-3 opam-switch fallback is closed (M-2, 2026-11-18): the flake builds the whole Coq stack from these pins."
